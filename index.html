<script>
const alphabet='abcdefghijklmnopqrstuvwxyz0123456789';
const socialAlphabet='abcdefghijklmnopqrstuvwxyz0123456789._';
const results=document.querySelector('#results');
const platform=document.querySelector('#platform');
let batchId=0;
let nextCheckAllowedAt=0;
function randomIndex(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}
function makeName(mode){const chars=platform.value==='discord'?alphabet:socialAlphabet;let value='';do{value=Array.from({length:3},()=>chars[randomIndex(chars.length)]).join('')}while((mode==='letters'&&/[0-9._]/.test(value))||(mode==='digits'&&!/[0-9]/.test(value))||value.startsWith('.')||value.endsWith('.')||value.includes('..'));return value}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function checkAvailability(name,status,button){const waitMs=nextCheckAllowedAt-Date.now();if(waitMs>0){status.textContent=`ديسكورد طلب الانتظار. أعد المحاولة بعد ${Math.ceil(waitMs/1000)} ثانية.`;return 'rate_limited'}button.disabled=true;button.textContent='يفحص...';status.className='status';status.textContent='جارٍ الفحص...';try{const response=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name})});if(response.status===429){let data={};try{data=await response.json()}catch{}const seconds=Math.max(10,Math.min(300,Number(data.retry_after)||30));nextCheckAllowedAt=Date.now()+seconds*1000;status.className='status';status.textContent=`ديسكورد أوقف الفحص مؤقتًا؛ انتظر ${seconds} ثانية.`;return 'rate_limited'}if(!response.ok)throw new Error('request failed');const data=await response.json();if(typeof data.taken!=='boolean')throw new Error('unexpected response');status.className=data.taken?'status taken':'status available';status.textContent=data.taken?'النتيجة: محجوز':'النتيجة: متاح';return 'checked'}catch{status.className='status';status.textContent='تعذّر الفحص؛ أعد المحاولة لاحقًا.';return 'error'}finally{button.disabled=false;button.textContent='أعد الفحص'}}
async function checkSocial(name,status,button){const waitMs=nextCheckAllowedAt-Date.now();if(waitMs>0){status.textContent=`انتظر ${Math.ceil(waitMs/1000)} ثانية قبل الفحص التالي.`;return 'rate_limited'}button.disabled=true;button.textContent='يفحص...';status.className='status';status.textContent='يفحص صفحة الحساب...';try{const response=await fetch('/api/check-social',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:platform.value,username:name})});if(response.status===429){let data={};try{data=await response.json()}catch{}const seconds=Math.max(5,Math.min(300,Number(data.retry_after)||10));nextCheckAllowedAt=Date.now()+seconds*1000;status.textContent=`طلبت المنصة الانتظار؛ أعد المحاولة بعد ${seconds} ثانية.`;return 'rate_limited'}if(!response.ok)throw new Error('request failed');const data=await response.json();if(data.state==='found'){status.className='status taken';status.textContent='ظهر حساب بهذا الاسم؛ يبدو محجوزًا.';return 'checked'}if(data.state==='not_found'){status.className='status';status.textContent='لم تظهر صفحة للحساب؛ هذا لا يؤكد توفر الاسم. جرّبه داخل التطبيق.';return 'checked'}status.className='status';status.textContent='تعذّر التأكد من الصفحة؛ قد تكون المنصة حجبت الفحص.';return 'unknown'}catch{status.className='status';status.textContent='تعذّر الاتصال؛ لم يتم التأكد.';return 'error'}finally{button.disabled=false;button.textContent='أعد الفحص'}}
function updatePlatform(){const social=platform.value!=='discord';document.querySelector('#title').textContent=`مولّد يوزرات ${platform.value==='discord'?'ديسكورد':platform.value==='tiktok'?'تيك توك':'إنستغرام'} ثلاثية`;document.querySelector('#notice').innerHTML=social?'<strong>طريقة التحقق:</strong> يفحص الموقع صفحة كل اسم تلقائيًا بالتتابع. هذه قراءة غير رسمية لصفحات عامة؛ «لم تظهر صفحة» لا تعني أن الاسم متاح، فقد يكون محجوزًا أو تمنع المنصة عرضه. أكّد توفره داخل التطبيق. لا تدخل كلمة مرورك هنا.':'<strong>طريقة التحقق:</strong> يبدأ فحص ديسكورد تلقائيًا بعد التوليد. قد يوقف ديسكورد الفحص مؤقتًا؛ عندها انتظر وأعد المحاولة. يعتمد الفحص على واجهة غير موثّقة وقد تتغير، لذلك أكّد النتيجة داخل إعدادات ديسكورد. لا تدخل كلمة مرورك أو رمز التحقق هنا.';document.querySelector('#foot').textContent=social?'كل اسم هنا من 3 خانات؛ حروف إنجليزية وأرقام ونقطة أو شرطة سفلية.':'كل اسم هنا من 3 خانات، بالأحرف الإنجليزية الصغيرة والأرقام.';render()}
function render(){const thisBatch=++batchId;const selectedPlatform=platform.value;const mode=document.querySelector('#mode').value;const names=new Set();while(names.size<12)names.add(makeName(mode));results.innerHTML='';const pending=[];for(const name of names){const row=document.createElement('div');row.className='user';const text=document.createElement('span');text.textContent=name;const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.className='copy';copy.textContent='نسخ';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(name);copy.textContent='تم النسخ';setTimeout(()=>copy.textContent='نسخ',1100)}catch{copy.textContent='انسخ يدويًا'}});const retry=document.createElement('button');retry.className='check';retry.textContent='أعد الفحص';const status=document.createElement('div');status.className='status';status.textContent='بانتظار الفحص التلقائي...';retry.addEventListener('click',()=>selectedPlatform==='discord'?checkAvailability(name,status,retry):checkSocial(name,status,retry));actions.append(copy,retry);row.append(text,actions,status);results.append(row);pending.push({name,status,retry})}(async()=>{for(let i=0;i<pending.length;i++){if(thisBatch!==batchId)return;const item=pending[i];item.status.textContent=`جارٍ الفحص تلقائيًا (${i+1} من ${pending.length})...`;const result=selectedPlatform==='discord'?await checkAvailability(item.name,item.status,item.retry):await checkSocial(item.name,item.status,item.retry);if(result==='rate_limited'){for(let j=i+1;j<pending.length;j++)pending[j].status.textContent='توقف الفحص احترامًا لحد المنصة؛ انتظر قبل المحاولة.';return}if(thisBatch!==batchId)return;if(i<pending.length-1)await pause(5000)}})()}
