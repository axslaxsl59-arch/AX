ect></label><label class="select">طول اليوزر<select id="usernameLength"><option value="3">3 خانات</option><option value="4">4 خانات</option><option value="5">5 خانات</option></select></label><button id="generate">ولّد يوزرات</button><button type="button" class="secondary" id="autoToggle" aria-pressed="true">الفحص التلقائي: يعمل</button></div><div id="results" class="results" aria-live="polite"></div><button id="more" class="secondary" style="width:100%">اقتراحات جديدة</button><div id="notice" class="notice"></div><div id="foot" class="foot"></div></section></main>
<script>
const alphabet='abcdefghijklmnopqrstuvwxyz0123456789';
const socialAlphabet='abcdefghijklmnopqrstuvwxyz0123456789._';
const results=document.querySelector('#results');
const platform=document.querySelector('#platform');
const usernameLength=document.querySelector('#usernameLength');
let autoCheck=true;const autoToggle=document.querySelector('#autoToggle');
let batchId=0;let nextCheckAllowedAt=0,lastCheckAt=0;
function randomIndex(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}
function makeName(mode){const chars=platform.value==='discord'?alphabet:socialAlphabet;let value='';do{value=Array.from({length:Number(usernameLength.value)},()=>chars[randomIndex(chars.length)]).join('')}while((mode==='letters'&&/[0-9._]/.test(value))||(mode==='digits'&&!/[0-9]/.test(value))||value.startsWith('.')||value.endsWith('.')||value.includes('..'));return value}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));async function checkAvailability(name,status,button){const intervalWait=5000-(Date.now()-lastCheckAt);if(intervalWait>0){status.textContent=`انتظر ${Math.ceil(intervalWait/1000)} ثوانٍ بين الفحوص.`;return 'rate_limited'}const waitMs=nextCheckAllowedAt-Date.now();if(waitMs>0){status.textContent=`ديسكورد طلب الانتظار. أعد المحاولة بعد ${Math.ceil(waitMs/1000)} ثانية.`;return 'rate_limited'}lastCheckAt=Date.now();button.disabled=true;button.textContent='يفحص...';status.className='status';status.textContent='جارٍ الفحص...';try{const response=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name})});if(response.status===429){let data={};try{data=await response.json()}catch{}const seconds=Math.max(10,Math.min(300,Number(data.retry_after)||30));nextCheckAllowedAt=Date.now()+seconds*1000;status.className='status';status.textContent=`ديسكورد أوقف الفحص مؤقتًا؛ انتظر ${seconds} ثانية.`;return 'rate_limited'}if(!response.ok)throw new Error('request failed');const data=await response.json();if(typeof data.taken!=='boolean')throw new Error('unexpected response');status.className=data.taken?'status taken':'status available';status.parentElement.classList.toggle('available',!data.taken);status.textContent=data.taken?'النتيجة: محجوز':'النتيجة: متاح';return 'checked'}catch{status.className='status';status.textContent='تعذّر الفحص؛ أعد المحاولة لاحقًا.';return 'error'}finally{button.disabled=false;button.textContent='أعد الفحص'}}async function checkSocial(name,status,button){const intervalWait=5000-(Date.now()-lastCheckAt);if(intervalWait>0){status.textContent=`انتظر ${Math.ceil(intervalWait/1000)} ثوانٍ بين الفحوص.`;return 'rate_limited'}const waitMs=nextCheckAllowedAt-Date.now();if(waitMs>0){status.textContent=`انتظر ${Math.ceil(waitMs/1000)} ثانية قبل الفحص التالي.`;return 'rate_limited'}lastCheckAt=Date.now();button.disabled=true;button.textContent='يفحص...';status.className='status';status.textContent='يفحص صفحة الحساب...';try{const response=await fetch('/api/check-social',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:platform.value,username:name})});if(response.status===429){let data={};try{data=await response.json()}catch{}const seconds=Math.max(5,Math.min(300,Number(data.retry_after)||10));nextCheckAllowedAt=Date.now()+seconds*1000;status.textContent=`طلبت المنصة الانتظار؛ أعد المحاولة بعد ${seconds} ثانية.`;return 'rate_limited'}if(!response.ok)throw new Error('request failed');const data=await response.json();if(data.state==='found'){status.className='status taken';status.textContent='ظهر حساب بهذا الاسم؛ يبدو محجوزًا.';return 'checked'}if(data.state==='not_found'){status.className='status';status.textContent='لم تظهر صفحة للحساب؛ هذا لا يؤكد توفر الاسم. جرّبه داخل التطبيق.';return 'checked'}status.className='status';status.textContent='تعذّر التأكد من الصفحة؛ قد تكون المنصة حجبت الفحص.';return 'unknown'}catch{status.className='status';status.textContent='تعذّر الاتصال؛ لم يتم التأكد.';return 'error'}finally{button.disabled=false;button.textContent='أعد الفحص'}}
function updatePlatform(){const social=platform.value!=='discord';document.querySelector('#title').textContent='مولّد يوزرات '+(platform.value==='discord'?'ديسكورد':platform.value==='tiktok'?'تيك توك':'تيك توك')+' ('+usernameLength.value+' خانات)';document.querySelector('#notice').innerHTML=social?'<strong>طريقة التحقق:</strong> يفحص الموقع صفحة كل اسم تلقائيًا بالتتابع. هذه قراءة غير رسمية لصفحات عامة؛ «لم تظهر صفحة» لا تعني أن الاسم متاح، فقد يكون محجوزًا أو تمنع المنصة عرضه. أكّد توفره داخل التطبيق. لا تدخل كلمة مرورك هنا.':'<strong>طريقة التحقق:</strong> يبدأ فحص ديسكورد تلقائيًا بعد التوليد. قد يوقف ديسكورد الفحص مؤقتًا؛ عندها انتظر وأعد المحاولة. يعتمد الفحص على واجهة غير موثّقة وقد تتغير، لذلك أكّد النتيجة داخل إعدادات ديسكورد. لا تدخل كلمة مرورك أو رمز التحقق هنا.';document.querySelector('#foot').textContent='الفاصل بين الفحوص 5 ثوانٍ. كل اسم هنا من '+usernameLength.value+' خانات؛ '+(social?'حروف إنجليزية وأرقام ونقطة أو شرطة سفلية.':'بالأحرف الإنجليزية الصغيرة والأرقام.');render()}
function render(){const thisBatch=++batchId;const selectedPlatform=platform.value;const mode=document.querySelector('#mode').value;const names=new Set();while(names.size<12)names.add(makeName(mode));results.innerHTML='';const pending=[];for(const name of names){const row=document.createElement('div');row.className='user';const text=document.createElement('span');text.textContent=name;const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.className='copy';copy.textContent='نسخ';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(name);copy.textContent='تم النسخ';setTimeout(()=>copy.textContent='نسخ',1100)}catch{copy.textContent='انسخ يدويًا'}});const retry=document.createElement('button');retry.className='check';retry.textContent='أعد الفحص';const status=document.createElement('div');status.className='status';status.textContent='بانتظار الفحص التلقائي...';retry.addEventListener('click',()=>selectedPlatform==='discord'?checkAvailability(name,status,retry):checkSocial(name,status,retry));actions.append(copy,retry);row.append(text,actions,status);results.append(row);pending.push({name,status,retry})}if(!autoCheck){for(const item of pending)item.status.textContent='الفحص التلقائي متوقف؛ اضغط أعد الفحص.';return}(async()=>{for(let i=0;i<pending.length;i++){if(thisBatch!==batchId)return;const item=pending[i];item.status.textContent=`جارٍ الفحص تلقائيًا (${i+1} من ${pending.length})...`;const result=selectedPlatform==='discord'?await checkAvailability(item.name,item.status,item.retry):await checkSocial(item.name,item.status,item.retry);if(result==='rate_limited'){for(let j=i+1;j<pending.length;j++)pending[j].status.textContent='توقف الفحص احترامًا لحد المنصة؛ انتظر قبل المحاولة.';return}if(thisBatch!==batchId)return;if(i<pending.length-1){for(let seconds=5;seconds>0;seconds--){if(thisBatch!==batchId)return;pending[i+1].status.textContent=`الفحص بعد ${seconds} ثوانٍ...`;await pause(1 document.querySelector('#generate').addEventListener('click',render);document.querySelector('#more').addEventListener('click',render);document.querySelector('#mode').addEventListener('change',render);platform.addEventListener('change',updatePlatform);usernameLength.addEventListener('change',updatePlatform);document.querySelector('#start').addEventListener('click',()=>{document.body.classList.add('entered');updatePlatform()});
let gameStatus=document.querySelector('#gameStatus'),activeGame='memory',flipped=[],matched=0,reactionStart=0,reactionWait=false,gameTimer;const gameBoard=document.querySelector('#gameBoard'),gameStart=document.querySelector('#gameStart');function setupGame(){clearTimeout(gameTimer);gameStart.disabled=false;gameStart.textContent='ابدأ اللعبة';gameStatus.textContent='';if(activeGame==='memory'){gameBoard.innerHTML='<p>اقلب البطاقات واعثر على الأزواج المتشابهة.</p><div class="memory-grid" id="memoryGrid"></div><p class="game-status" id="gameStatus"></p>';gameStatus=document.querySelector('#gameStatus')}else{gameBoard.innerHTML='<p>انتظر اللون الأخضر ثم اضغط بسرعة.</p><button class="reaction-target" id="reactionTarget">ابدأ اللعبة وانتظر</button><p class="game-status" id="gameStatus"></p>';gameStatus=document.querySelector('#gameStatus');document.querySelector('#reactionTarget').onclick=()=>{if(reactionStart){gameStatus.textContent='سرعتك '+(Date.now()-reactionStart)+' مللي ثانية!';reactionStart=0;gameStart.disabled=false;gameStart.textContent='العب مرة ثانية'}else if(reactionWait){clearTimeout(gameTimer);reactionWait=false;gameStatus.textContent='ضغطت بدري! حاول مرة ثانية.';gameStart.disabled=false;gameStart.textContent='ابدأ اللعبة'}}}}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{activeGame=b.dataset.game;document.querySelectorAll('[data-game]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));setupGame()});gameStart.onclick=()=>{gameStart.disabled=true;if(activeGame==='memory'){const icons=['🦇','🔴','🌙','🃏'],cards=[...icons,...icons].sort(()=>Math.random()-.5),grid=document.querySelector('#memoryGrid');flipped=[];matched=0;grid.innerHTML='';cards.forEach(icon=>{const c=document.createElement('button');c.className='memory-card';c.textContent='?';c.onclick=()=>{if(c.classList.contains('open')||c.classList.contains('matched')||flipped.length===2)return;c.textContent=icon;c.classList.add('open');flipped.push({c,icon});if(flipped.length===2){if(flipped[0].icon===flipped[1].icon){flipped.forEach(x=>x.c.classList.add('matched'));matched+=2;flipped=[];if(matched===8){gameStatus.textContent='فزت! وجدت كل الأزواج 🏆';gameStart.disabled=false}}else{const pair=flipped;flipped=[];setTimeout(()=>pair.forEach(x=>{x.c.textContent='?';x.c.classList.remove('open')}),700)}}};grid.append(c)});gameStatus.textContent='ابدأ! اعثر على كل الأزواج.'}else{const target=document.querySelector('#reactionTarget');target.textContent='انتظر... لا تضغط';reactionWait=true;gameTimer=setTimeout(()=>{reactionWait=false;reactionStart=Date.now();target.classList.add('ready');target.textContent='اضغط الآن!';gameStart.disabled=false},1000+Math.random()*2500)}};setupGame();</script></body></html
